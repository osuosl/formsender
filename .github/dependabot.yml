---
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # Sphinx 9.1.0 pins docutils<0.23, so hold docutils below 0.23
      # until a Sphinx release supports it (sphinx-doc/sphinx#14455).
      - dependency-name: "docutils"
        versions: [">=0.23"]
      # The altcha library and the browser widget share a challenge protocol
      # that changes with the major version, so upgrade them together by hand.
      - dependency-name: "altcha"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
